backend:
  name: git-gateway
  branch: main

media_folder: "images/cakes"
public_folder: "/images/cakes"

collections:
  - name: "cakes"
    label: "Cakes"
    file: "content/cakes/index.json"
    fields:
      - label: "Cake List"
        name: "cakes"
        widget: "list"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Price", name: "price", widget: "string"}
          - {label: "Description", name: "description", widget: "text", required: false}
          - {label: "Cake Image", name: "image", widget: "image"}
