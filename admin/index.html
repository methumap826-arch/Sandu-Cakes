<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandu Cake Admin Panel</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body style="background: linear-gradient(135deg, #fff5f8 0%, #fbcfe8 45%, #f472b6 80%, #db2777 100%); min-height: 100vh;">

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Inject Custom Glassy Pink CSS into Netlify CMS Editor
    const customCSS = `
      body, #nc-root {
        background: linear-gradient(135deg, #fff5f8 0%, #fbcfe8 45%, #f472b6 80%, #db2777 100%) !important;
        background-attachment: fixed !important;
        font-family: 'Inter', sans-serif !important;
      }
      
      header {
        background: rgba(255, 255, 255, 0.35) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.5) !important;
      }

      div[class*="AppMainContainer"], main {
        background: transparent !important;
      }

      div[class*="EditorControlPane"], 
      div[class*="SidebarContainer"], 
      div[class*="CollectionTop"],
      div[class*="ControlContainer"] {
        background: rgba(255, 255, 255, 0.3) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.5) !important;
        border-radius: 18px !important;
        box-shadow: 0 8px 32px 0 rgba(219, 39, 119, 0.15) !important;
        margin: 10px !important;
      }

      input[type="text"], textarea, select {
        background: rgba(255, 255, 255, 0.6) !important;
        border: 1px solid rgba(255, 255, 255, 0.8) !important;
        border-radius: 12px !important;
        color: #3b0764 !important;
      }

      input[type="text"]:focus, textarea:focus {
        background: rgba(255, 255, 255, 0.95) !important;
        border-color: #db2777 !important;
        box-shadow: 0 0 10px rgba(219, 39, 119, 0.3) !important;
      }

      label {
        color: #be185d !important;
        font-weight: 700 !important;
      }

      button, a[class*="Button"] {
        border-radius: 50px !important;
      }
    `;

    // Inject styles dynamically
    const styleEl = document.createElement('style');
    styleEl.innerHTML = customCSS;
    document.head.appendChild(styleEl);

    // Register Live Preview Glassy Style
    CMS.registerPreviewStyle(`
      body {
        background: linear-gradient(135deg, #fff5f8 0%, #fbcfe8 100%) !important;
        padding: 20px !important;
        color: #3b0764 !important;
        font-family: sans-serif !important;
      }
      img {
        max-width: 100% !important;
        border-radius: 16px !important;
        box-shadow: 0 8px 20px rgba(219, 39, 119, 0.2) !important;
      }
    `);
  </script>
</body>
</html>
