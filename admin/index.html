<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandu Cake Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* Force Glassy Pink Background on entire Admin App */
    html, body, #nc-root, div[id^="nc-root"] {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%) !important;
      background-attachment: fixed !important;
      font-family: 'Poppins', sans-serif !important;
      color: #4a154b !important;
    }

    /* Top Bar */
    header[class*="AppHeader"] {
      background: rgba(255, 255, 255, 0.35) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5) !important;
    }

    /* Main Container overrides */
    main, div[class*="AppMainContainer"] {
      background: transparent !important;
    }

    /* Left Control Pane & Cards */
    div[class*="SidebarContainer"],
    div[class*="CollectionTop"],
    div[class*="EditorControlPane"],
    div[class*="ControlContainer"],
    div[class*="ListControl"] {
      background: rgba(255, 255, 255, 0.3) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 20px !important;
      box-shadow: 0 8px 32px 0 rgba(230, 0, 126, 0.12) !important;
      margin-bottom: 12px !important;
    }

    /* Input Controls */
    input[type="text"], textarea, select {
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      border-radius: 12px !important;
      color: #3b0764 !important;
      font-family: 'Poppins', sans-serif !important;
    }

    input[type="text"]:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.95) !important;
      border-color: #d81b60 !important;
      box-shadow: 0 0 12px rgba(216, 27, 96, 0.3) !important;
      outline: none !important;
    }

    label[class*="ControlLabel"] {
      color: #be185d !important;
      font-weight: 700 !important;
    }

    /* Right Side Preview Pane Window */
    div[class*="PreviewPaneContainer"] {
      background: rgba(255, 255, 255, 0.2) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      border-radius: 20px !important;
      margin: 10px !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>

  <!-- Decap CMS Core Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Custom Glassy Preview Script -->
  <script>
    // 1. Inject Styles directly into Preview iframe
    CMS.registerPreviewStyle(`
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
      
      body {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%) !important;
        background-attachment: fixed !important;
        font-family: 'Poppins', sans-serif !important;
        padding: 20px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        min-height: 90vh !important;
      }

      .preview-glass-card {
        background: rgba(255, 255, 255, 0.35) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border-radius: 24px !important;
        border: 1px solid rgba(255, 255, 255, 0.6) !important;
        box-shadow: 0 10px 35px rgba(216, 27, 96, 0.2) !important;
        padding: 24px !important;
        width: 100% !important;
        max-width: 360px !important;
        text-align: center !important;
      }

      .preview-img-box {
        width: 100% !important;
        height: 220px !important;
        border-radius: 18px !important;
        overflow: hidden !important;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
        margin-bottom: 16px !important;
        background: rgba(255,255,255,0.4) !important;
      }

      .preview-img-box img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
      }

      .preview-title {
        font-size: 22px !important;
        font-weight: 700 !important;
        color: #8b2657 !important;
        margin-bottom: 6px !important;
      }

      .preview-price {
        display: inline-block !important;
        background: rgba(216, 27, 96, 0.15) !important;
        color: #d81b60 !important;
        font-weight: 700 !important;
        padding: 6px 16px !important;
        border-radius: 50px !important;
        font-size: 15px !important;
        margin-bottom: 12px !important;
        border: 1px solid rgba(216, 27, 96, 0.3) !important;
      }

      .preview-desc {
        font-size: 13px !important;
        color: #5c1d3d !important;
        line-height: 1.5 !important;
        margin-bottom: 18px !important;
      }

      .preview-btn {
        width: 100% !important;
        padding: 12px !important;
        border-radius: 12px !important;
        background: linear-gradient(135deg, #ff69b4, #d81b60) !important;
        color: white !important;
        font-weight: 600 !important;
        border: none !important;
        box-shadow: 0 6px 18px rgba(216, 27, 96, 0.35) !important;
      }
    `);

    // 2. Custom Preview React Component for Cakes List
    const CakesPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const cakes = entry.getIn(['data', 'cakes']);
        const getAsset = this.props.getAsset;

        if (!cakes) return h('div', {}, 'No cakes added yet.');

        return h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '20px', justifyContent: 'center' } },
          cakes.map((cake, index) => {
            const title = cake.get('title') || 'Cake Title';
            const price = cake.get('price') || 'LKR 0';
            const description = cake.get('description') || '';
            const image = cake.get('image');
            const imageUrl = image ? getAsset(image).toString() : '';

            return h('div', { key: index, className: 'preview-glass-card' },
              imageUrl ? h('div', { className: 'preview-img-box' },
                h('img', { src: imageUrl, alt: title })
              ) : null,
              h('div', { className: 'preview-title' }, title),
              h('div', { className: 'preview-price' }, price),
              description ? h('div', { className: 'preview-desc' }, description) : null,
              h('button', { className: 'preview-btn' }, 'Order Now 🍰')
            );
          })
        );
      }
    });

    // Register Component for "cakes_list" entry
    CMS.registerPreviewTemplate('cakes_list', CakesPreview);
  </script>
</body>
</html>
