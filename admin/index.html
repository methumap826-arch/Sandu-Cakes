<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandu Cake - Admin Panel</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var LivePreview = createClass({
      render: function() {
        return h('iframe', {
          src: 'https://sanducakes.netlify.app/#order',
          style: { width: '100%', height: '100vh', border: 'none' }
        });
      }
    });

    CMS.registerPreviewTemplate('cakes_list', LivePreview);
    CMS.registerPreviewTemplate('cakes_menu', LivePreview);
    CMS.registerPreviewTemplate('cake_data', LivePreview);
  </script>
</body>
</html>
