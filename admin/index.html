<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandu Cake Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* Admin Dashboard Glassy Pink Overrides */
    html, body, #nc-root {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%) !important;
      background-attachment: fixed !important;
      font-family: 'Poppins', sans-serif !important;
      color: #4a154b !important;
      min-height: 100vh !important;
    }

    header[class*="AppHeader"] {
      background: rgba(255, 255, 255, 0.4) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.6) !important;
    }

    main, div[class*="AppMainContainer"] {
      background: transparent !important;
    }

    div[class*="SidebarContainer"],
    div[class*="CollectionTop"],
    div[class*="EditorControlPane"],
    div[class*="ControlContainer"],
    div[class*="ListControl"] {
      background: rgba(255, 255, 255, 0.35) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.7) !important;
      border-radius: 24px !important;
      box-shadow: 0 10px 35px rgba(216, 27, 96, 0.15) !important;
      margin-bottom: 15px !important;
    }

    input[type="text"], textarea, select {
      background: rgba(255, 255, 255, 0.65) !important;
      backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.9) !important;
      border-radius: 14px !important;
      color: #4a154b !important;
      font-family: 'Poppins', sans-serif !important;
    }

    input[type="text"]:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.95) !important;
      border-color: #d81b60 !important;
      box-shadow: 0 0 15px rgba(216, 27, 96, 0.3) !important;
      outline: none !important;
    }

    label[class*="ControlLabel"] {
      color: #8b2657 !important;
      font-weight: 700 !important;
      font-size: 13px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
    }

    div[class*="PreviewPaneContainer"] {
      background: rgba(255, 255, 255, 0.25) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 24px !important;
      margin: 10px !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Injecting exact Website Card CSS into the Preview iframe
    CMS.registerPreviewStyle(`
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
      
      body {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%) !important;
        background-attachment: fixed !important;
        font-family: 'Poppins', sans-serif !important;
        padding: 30px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: flex-start !important;
        min-height: 100vh !important;
        box-sizing: border-box !important;
      }

      .preview-wrapper {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 25px !important;
        justify-content: center !important;
        width: 100% !important;
      }

      /* Exact Website Glassy Card Style */
      .website-glass-card {
        background: rgba(255, 255, 255, 0.4) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border-radius: 30px !important;
        border: 1px solid rgba(255, 255, 255, 0.8) !important;
        box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15) !important;
        padding: 24px !important;
        width: 100% !important;
        max-width: 280px !important;
        text-align: left !important;
      }

      .website-img-box {
        width: 100% !important;
        height: 200px !important;
        border-radius: 20px !important;
        overflow: hidden !important;
        margin-bottom: 15px !important;
        background: rgba(255, 255, 255, 0.5) !important;
      }

      .website-img-box img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
      }

      .card-tag {
        font-size: 11px !important;
        font-weight: 700 !important;
        color: #d81b60 !important;
        letter-spacing: 1px !important;
        text-transform: uppercase !important;
        margin-bottom: 4px !important;
      }

      .card-title {
        font-size: 20px !important;
        font-weight: 700 !important;
        color: #4a154b !important;
        margin-bottom: 15px !important;
      }

      .card-footer {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }

      .card-price {
        font-size: 16px !important;
        font-weight: 700 !important;
        color: #d81b60 !important;
      }

      .card-order-btn {
        background: rgba(255, 255, 255, 0.8) !important;
        border: 1px solid rgba(255, 255, 255, 0.9) !important;
        color: #4a154b !important;
        font-weight: 600 !important;
        padding: 8px 20px !important;
        border-radius: 50px !important;
        font-size: 14px !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
      }
    `);

    const createClass = window.createClass || React.createClass;
    const h = window.h || React.createElement;

    const CakesPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const cakes = entry.getIn(['data', 'cakes']);
        const getAsset = this.props.getAsset;

        if (!cakes || !cakes.size) {
          return h('div', { className: 'preview-wrapper' }, 'No cakes added yet.');
        }

        const cakeElements = cakes.toArray().map((cake, index) => {
          const title = cake.get('title') || 'Cake Title';
          const price = cake.get('price') || 'Rs. LKR 0';
          const image = cake.get('image');
          const imageUrl = image ? getAsset(image).toString() : '';

          return h('div', { key: index, className: 'website-glass-card' },
            imageUrl ? h('div', { className: 'website-img-box' },
              h('img', { src: imageUrl, alt: title })
            ) : null,
            h('div', { className: 'card-tag' }, 'SPECIAL'),
            h('div', { className: 'card-title' }, title),
            h('div', { className: 'card-footer' },
              h('div', { className: 'card-price' }, price),
              h('button', { className: 'card-order-btn' }, 'Order')
            )
          );
        });

        return h('div', { className: 'preview-wrapper' }, cakeElements);
      }
    });

    CMS.registerPreviewTemplate('cakes_list', CakesPreview);
  </script>
</body>
</html>
