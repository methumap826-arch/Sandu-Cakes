<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassy Look - Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* Admin Dashboard overall look */
    html, body, #nc-root {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%) !important;
      background-attachment: fixed !important;
      font-family: 'Poppins', sans-serif !important;
    }

    /* Right side preview container area */
    div[class*="PreviewPaneContainer"] {
      background: rgba(255, 255, 255, 0.25) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.5) !important;
    }
  </style>
</head>
<body>

  <!-- Decap CMS Core Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 1. Website එකේ තියෙන විදිහටම Glass Look එක Preview එක ඇතුළට Inject කිරීම
    CMS.registerPreviewStyle(`
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
      
      body {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%) !important;
        background-attachment: fixed !important;
        font-family: 'Poppins', sans-serif !important;
        padding: 40px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: flex-start !important;
        min-height: 100vh !important;
        box-sizing: border-box !important;
        margin: 0 !important;
      }

      .preview-list-wrapper {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 30px !important;
        justify-content: center !important;
        width: 100% !important;
      }

      /* Website එකේ තියෙන Glassy Card Design එකමයි */
      .website-glass-card {
        background: rgba(255, 255, 255, 0.35) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border-radius: 30px !important;
        border: 1px solid rgba(255, 255, 255, 0.7) !important;
        box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15) !important;
        padding: 24px !important;
        width: 100% !important;
        max-width: 280px !important;
        text-align: left !important;
      }

      .website-img-box {
        width: 100% !important;
        height: 200px !important;
        border-radius: 20px !important;
        overflow: hidden !important;
        margin-bottom: 15px !important;
        background: rgba(255, 255, 255, 0.4) !important;
      }

      .website-img-box img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
      }

      .card-tag {
        font-size: 11px !important;
        font-weight: 700 !important;
        color: #d81b60 !important;
        letter-spacing: 1px !important;
        text-transform: uppercase !important;
        margin-bottom: 4px !important;
      }

      .card-title {
        font-size: 20px !important;
        font-weight: 700 !important;
        color: #4a154b !important;
        margin-bottom: 15px !important;
      }

      .card-footer {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }

      .card-price {
        font-size: 16px !important;
        font-weight: 700 !important;
        color: #d81b60 !important;
      }

      .card-order-btn {
        background: rgba(255, 255, 255, 0.8) !important;
        border: 1px solid rgba(255, 255, 255, 0.9) !important;
        color: #4a154b !important;
        font-weight: 600 !important;
        padding: 8px 20px !important;
        border-radius: 50px !important;
        font-size: 14px !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
      }
    `);

    const createClass = window.createClass || React.createClass;
    const h = window.h || React.createElement;

    // 2. CMS එකට අදාළ Preview Component එක නිර්මාණය කිරීම
    const CakesPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const cakes = entry.getIn(['data', 'cakes']);
        const getAsset = this.props.getAsset;

        if (!cakes || !cakes.size) {
          return h('div', { className: 'preview-list-wrapper', style: { color: '#4a154b', fontWeight: '600' } }, 'No cakes added yet.');
        }

        const cakeElements = cakes.toArray().map((cake, index) => {
          const title = cake.get('title') || 'Cake Title';
          const price = cake.get('price') || 'Rs. 0';
          const image = cake.get('image');
          const imageUrl = image ? getAsset(image).toString() : '';

          return h('div', { key: index, className: 'website-glass-card' },
            imageUrl ? h('div', { className: 'website-img-box' },
              h('img', { src: imageUrl, alt: title })
            ) : null,
            h('div', { className: 'card-tag' }, 'SPECIAL'),
            h('div', { className: 'card-title' }, title),
            h('div', { className: 'card-footer' },
              h('div', { className: 'card-price' }, price),
              h('button', { className: 'card-order-btn' }, 'Order')
            )
          );
        });

        return h('div', { className: 'preview-list-wrapper' }, cakeElements);
      }
    });

    CMS.registerPreviewTemplate('cakes_list', CakesPreview);
  </script>
</body>
</html>
